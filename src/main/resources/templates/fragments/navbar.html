<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg custom-navbar sticky-top">
    <div class="container">
        <!-- Brand Logo & Name -->
        <a class="navbar-brand-logo" th:href="@{/dashboard}">
            <div class="brand-icon">
                <i class="bi bi-patch-check-fill"></i>
            </div>
            <div>
                <span>CertVerify</span>
                <span class="brand-tagline">Digital Certificate Portal</span>
            </div>
        </a>

        <!-- Mobile Toggle Button -->
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#certVerifyNav" aria-controls="certVerifyNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="certVerifyNav">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}" th:href="@{/dashboard}">
                        <i class="bi bi-grid-1x2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'participants' ? 'active' : ''}" th:href="@{/participants}">
                        <i class="bi bi-people"></i> Participants
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'courses' ? 'active' : ''}" th:href="@{/courses}">
                        <i class="bi bi-book"></i> Courses &amp; Events
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'certificates' ? 'active' : ''}" th:href="@{/certificates}">
                        <i class="bi bi-award"></i> Certificates
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-primary fw-bold" th:classappend="${activePage == 'verify' ? 'active' : ''}" th:href="@{/verify}">
                        <i class="bi bi-shield-check"></i> Verify Certificate
                    </a>
                </li>
            </ul>

            <!-- Right Profile / Status Info -->
            <div class="d-flex align-items-center gap-2">
                <span class="admin-badge">
                    <i class="bi bi-building-check text-primary"></i> Institution Admin
                </span>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
