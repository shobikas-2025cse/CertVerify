<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'CertVerify — Edit Participant' : 'CertVerify — New Participant'}">CertVerify — Participant Form</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navigation -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-4">
    <div class="container">

        <!-- Flash Alerts -->
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Breadcrumb & Header -->
        <div class="mb-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1 small text-muted">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}" class="text-decoration-none">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/participants}" class="text-decoration-none">Participants</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${isEdit ? 'Edit Participant' : 'New Participant'}">New Participant</li>
                </ol>
            </nav>
            <h1 class="h3 fw-bold mb-0 text-dark" th:text="${isEdit ? 'Edit Participant' : 'Register New Participant'}">Register Participant</h1>
            <p class="text-muted small">Enter participant details below. All fields marked with * are required.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="custom-card">
                    <div class="custom-card-header">
                        <h5>
                            <i class="bi bi-person-badge text-primary"></i>
                            <span th:text="${isEdit ? 'Update Participant Information' : 'Participant Details'}">Participant Details</span>
                        </h5>
                    </div>
                    <div class="custom-card-body p-4">
                        <form th:action="${isEdit ? '/participants/edit/' + participant.id : '/participants'}"
                              th:object="${participant}"
                              method="post"
                              data-loading>

                            <!-- Participant Full Name -->
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                                <input type="text"
                                       class="form-control"
                                       id="name"
                                       th:field="*{name}"
                                       placeholder="e.g. Arun Kumar"
                                       th:classappend="${#fields.hasErrors('name') ? 'is-invalid' : ''}"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                    Name is required
                                </div>
                            </div>

                            <!-- Email Address -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       th:field="*{email}"
                                       placeholder="e.g. arun@gmail.com"
                                       th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                    Enter a valid email
                                </div>
                                <div class="form-text small text-muted">Used for participant identification and records.</div>
                            </div>

                            <!-- Phone Number -->
                            <div class="mb-4">
                                <label for="phone" class="form-label fw-semibold">Phone Number</label>
                                <input type="text"
                                       class="form-control"
                                       id="phone"
                                       th:field="*{phone}"
                                       placeholder="e.g. 9876543210">
                            </div>

                            <!-- Buttons -->
                            <div class="d-flex align-items-center gap-2 pt-2 border-top">
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="bi bi-check2-circle me-1"></i>
                                    <span th:text="${isEdit ? 'Update Participant' : 'Save Participant'}">Save Participant</span>
                                </button>
                                <a th:href="@{/participants}" class="btn btn-outline-secondary px-3">Cancel</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
