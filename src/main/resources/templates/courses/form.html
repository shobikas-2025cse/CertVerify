<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'CertVerify — Edit Course' : 'CertVerify — New Course'}">CertVerify — Course Form</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navigation -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-4">
    <div class="container">

        <!-- Flash Alerts -->
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Breadcrumb & Header -->
        <div class="mb-4">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1 small text-muted">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}" class="text-decoration-none">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/courses}" class="text-decoration-none">Courses</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${isEdit ? 'Edit Course' : 'New Course'}">New Course</li>
                </ol>
            </nav>
            <h1 class="h3 fw-bold mb-0 text-dark" th:text="${isEdit ? 'Edit Course / Event' : 'Create Course / Event'}">Create Course</h1>
            <p class="text-muted small">Specify course curriculum or event title to issue certificates under.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="custom-card">
                    <div class="custom-card-header">
                        <h5>
                            <i class="bi bi-book-half text-primary"></i>
                            <span th:text="${isEdit ? 'Update Course Information' : 'Course Details'}">Course Details</span>
                        </h5>
                    </div>
                    <div class="custom-card-body p-4">
                        <form th:action="${isEdit ? '/courses/edit/' + course.id : '/courses'}"
                              th:object="${course}"
                              method="post"
                              data-loading>

                            <!-- Course Name -->
                            <div class="mb-3">
                                <label for="courseName" class="form-label fw-semibold">Course / Event Name <span class="text-danger">*</span></label>
                                <input type="text"
                                       class="form-control"
                                       id="courseName"
                                       th:field="*{courseName}"
                                       placeholder="e.g. Java Full Stack Development"
                                       th:classappend="${#fields.hasErrors('courseName') ? 'is-invalid' : ''}"
                                       required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('courseName')}" th:errors="*{courseName}">
                                    Course name is required
                                </div>
                            </div>

                            <!-- Description -->
                            <div class="mb-4">
                                <label for="description" class="form-label fw-semibold">Description</label>
                                <textarea class="form-control"
                                          id="description"
                                          rows="4"
                                          th:field="*{description}"
                                          placeholder="Provide a brief overview of topics, syllabus, or event description..."></textarea>
                                <div class="form-text small text-muted">This description will appear on the course records and statistics.</div>
                            </div>

                            <!-- Buttons -->
                            <div class="d-flex align-items-center gap-2 pt-2 border-top">
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="bi bi-check2-circle me-1"></i>
                                    <span th:text="${isEdit ? 'Update Course' : 'Save Course'}">Save Course</span>
                                </button>
                                <a th:href="@{/courses}" class="btn btn-outline-secondary px-3">Cancel</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
