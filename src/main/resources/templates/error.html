<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertVerify — Error</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navigation -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container text-center py-5">
        <div class="empty-state max-w-500 mx-auto">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle-fill display-3"></i>
            </div>
            <h1 class="h3 fw-bold text-dark mb-2">Something went wrong</h1>
            <p class="text-muted mb-4">
                We encountered an unexpected issue while processing your request. Please check the URL or try again later.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/dashboard}" class="btn btn-primary px-4">
                    <i class="bi bi-grid-1x2 me-1"></i> Return to Dashboard
                </a>
                <a th:href="@{/verify}" class="btn btn-outline-secondary px-3">
                    <i class="bi bi-shield-check me-1"></i> Verify Certificate
                </a>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
